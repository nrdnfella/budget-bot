services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # no ports published: only the bot can reach the model

  ollama-pull:
    image: ollama/ollama
    depends_on: [ollama]
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

  bot:
    build: .
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    depends_on: [ollama]
    restart: unless-stopped

volumes:
  ollama: {}
